<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#fff6e0">
<title>¡A aprender jugando!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@500;600;700&display=swap">
<style>
:root{
  --paper:#fff8e8; --dots:#f2dfb4; --ink:#2a2350; --muted:#6d6690; --card:#ffffff;
  --blue:#2f6fe4; --red:#ef4b3f; --sun:#ffc83d; --leaf:#2fb35a; --pink:#f2679e; --violet:#7d5cf0; --orange:#ff8a2b; --sky:#5cc8f0;
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --body:"Andika","Trebuchet MS",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:clamp(15px,3.6vw,26px)}
html,body{touch-action:manipulation;-webkit-text-size-adjust:100%;margin:0;min-height:100%}
body{background-color:var(--paper);background-image:radial-gradient(var(--dots) 2px,transparent 2.5px);background-size:28px 28px;
  color:var(--ink);font-family:var(--body);line-height:1.35;text-transform:uppercase;-webkit-user-select:none;user-select:none}
[hidden]{display:none!important}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;text-transform:inherit}
button:focus-visible,input:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
input,textarea{-webkit-user-select:text;user-select:text}
.wrap{max-width:900px;margin:0 auto;padding:calc(.8rem + env(safe-area-inset-top,0px)) max(.9rem,env(safe-area-inset-right,0px)) calc(2rem + env(safe-area-inset-bottom,0px)) max(.9rem,env(safe-area-inset-left,0px))}
.card{background:var(--card);border:.18rem solid var(--ink);border-radius:1.3rem;box-shadow:0 .3rem 0 var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;padding:.6rem 1.1rem;font:700 1.1rem var(--display);border:.18rem solid var(--ink);border-radius:1rem;box-shadow:0 .25rem 0 var(--ink);background:var(--card);text-transform:uppercase}
.btn:active,.tile:active,.opt:active{transform:translateY(.2rem);box-shadow:0 .05rem 0 var(--ink)}
.btn.yellow{background:var(--sun)}.btn.blue{background:var(--blue);color:#fff}.btn.green{background:var(--leaf);color:#fff}.btn.red{background:var(--red);color:#fff}
.round{width:3.2rem;height:3.2rem;border-radius:50%;display:grid;place-items:center;font-size:1.6rem;background:var(--card);border:.18rem solid var(--ink);box-shadow:0 .25rem 0 var(--ink);flex:none}
.round:active{transform:translateY(.2rem);box-shadow:0 .05rem 0 var(--ink)}
h1,h2,h3{font-family:var(--display);margin:0;text-transform:uppercase}
.up{text-transform:uppercase}

/* top bar */
.top{display:flex;align-items:center;gap:.6rem;margin-bottom:1rem}
.top .grow{flex:1;min-width:0}
.chip{display:flex;align-items:center;gap:.5rem;padding:.25rem .9rem .25rem .25rem;border-radius:2rem;background:var(--card);border:.18rem solid var(--ink);box-shadow:0 .25rem 0 var(--ink);max-width:100%}
.chip .av{width:2.6rem;height:2.6rem;font-size:1.6rem}
.chip b{font:700 1.15rem var(--display);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{border-radius:50%;display:grid;place-items:center;background:var(--c,var(--sun));border:.15rem solid var(--ink);flex:none;line-height:1}
.starcount{display:flex;align-items:center;gap:.25rem;font:700 1.3rem var(--display);background:var(--sun);border:.18rem solid var(--ink);border-radius:2rem;padding:.25rem .8rem;box-shadow:0 .25rem 0 var(--ink)}
.starcount.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.3) rotate(-6deg)}}

/* players */
.deco-row{text-align:center;font-size:2.2rem;letter-spacing:.3rem;margin-top:.6rem}
.deco-row span{display:inline-block;animation:wiggle 3s ease-in-out infinite}
.who-title{text-align:center;font-size:2rem;margin:1.2rem 0 .3rem}
.who-sub{text-align:center;color:var(--muted);margin:0 0 1.2rem;font-size:1rem}
.players{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem}
.pl{display:flex;flex-direction:column;align-items:center;gap:.5rem;padding:1.1rem .5rem}
.pl .av{width:6.5rem;height:6.5rem;font-size:4.2rem}
.pl b{font:700 1.5rem var(--display);text-transform:uppercase;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.pl.add .av{background:#eef1ff;border-style:dashed;font-size:3.5rem;color:var(--muted)}
.pl:nth-child(odd){transform:rotate(-1.5deg)}.pl:nth-child(even){transform:rotate(1.5deg)}
.pl:active{transform:scale(.97)}
.animals{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.6rem;margin:.8rem 0}
.animals button{aspect-ratio:1;font-size:2.6rem;border-radius:1rem;border:.18rem solid var(--ink);background:var(--c);display:grid;place-items:center}
.animals button[aria-pressed=true]{outline:.35rem solid var(--ink);transform:scale(1.07)}
.namein{width:100%;font:700 1.6rem var(--display);text-transform:uppercase;text-align:center;padding:.6rem;border:.18rem solid var(--ink);border-radius:1rem;background:#fff}
.lbl{font:600 .85rem var(--display);color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:.8rem 0 .3rem}

/* home */
.hello{display:flex;align-items:center;gap:.8rem;margin:.2rem 0 1rem}
.hello .av{width:4.6rem;height:4.6rem;font-size:3rem;animation:wiggle 2.6s ease-in-out infinite}
.hello h1{font-size:1.9rem;line-height:1.05}
@keyframes wiggle{0%,100%{transform:rotate(0)}10%{transform:rotate(-10deg)}20%{transform:rotate(10deg)}30%{transform:rotate(0)}}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.3rem;padding:1rem .4rem .8rem;background:var(--card);border:.18rem solid var(--ink);border-radius:1.4rem;box-shadow:0 .3rem 0 var(--ink);position:relative;overflow:hidden;min-height:8.5rem}
.tile::before{content:"";position:absolute;top:0;left:0;right:0;height:.9rem;background:var(--c)}
.tile .ic{font-size:3.4rem;line-height:1.1;margin-top:.4rem}
.tile .nm{font:700 1.15rem/1.1 var(--display);text-transform:uppercase;text-align:center}
.tile .mini{position:absolute;top:1.2rem;right:.6rem;font:700 .8rem var(--display);background:var(--sun);border:.13rem solid var(--ink);border-radius:1rem;padding:.05rem .45rem}
.tile.wide{grid-column:1/-1;flex-direction:row;min-height:auto;padding:1.2rem 1rem .8rem;gap:.8rem}
.tile.wide .ic{font-size:2.6rem;margin:0}
.tile.wide .nm{font-size:1.3rem}
.tile:nth-child(4n+1){transform:rotate(-.8deg)}.tile:nth-child(4n+3){transform:rotate(.8deg)}
.prog{margin:1.2rem 0 .4rem;padding:.8rem 1rem;display:flex;align-items:center;gap:.8rem}
.prog .bar{flex:1;height:1.3rem;border:.15rem solid var(--ink);border-radius:1rem;background:#fff3cf;overflow:hidden}
.prog .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),var(--orange));border-radius:1rem;transition:width .6s}
.prog .next{font-size:2.2rem;filter:brightness(0) opacity(.25)}
.turnsbar{display:flex;align-items:center;gap:.6rem;padding:.6rem .8rem;margin-bottom:1rem;background:#e8f7ec}
.turnsbar .grow{font:700 1rem var(--display);text-transform:uppercase}
.secttl{display:flex;align-items:center;gap:.6rem;margin:0 0 1rem}
.secttl .ic{font-size:2.6rem}
.secttl h1{font-size:1.7rem;line-height:1.05}

/* alphabet */
.abc{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.55rem}
.abc button{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;font:700 2.1rem var(--display);border:.18rem solid var(--ink);border-radius:1rem;background:var(--c);box-shadow:0 .2rem 0 var(--ink);color:var(--ink)}
.abc button small{font-size:1.15rem;margin-top:.15rem}
.abc button:active{transform:translateY(.15rem);box-shadow:none}
.letterhead{display:flex;align-items:center;justify-content:center;gap:1rem;margin:.4rem 0 1rem}
.biglet{font:700 7rem/1 var(--display);color:var(--c);-webkit-text-stroke:.2rem var(--ink);text-shadow:0 .35rem 0 var(--ink);cursor:pointer;animation:pop .5s}
.words{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.8rem}
.word{display:flex;flex-direction:column;align-items:center;gap:.2rem;padding:.8rem .3rem;background:#fff;border:.18rem solid var(--ink);border-radius:1.2rem;box-shadow:0 .25rem 0 var(--ink)}
.word .em{font-size:3.8rem;line-height:1.1}
.word .wt{font:700 1.25rem var(--display);letter-spacing:.06em;min-height:1.6rem;opacity:0;transform:translateY(.4rem);transition:.3s}
.word.on .wt{opacity:1;transform:none}
.wt .f,.reveal .f{color:var(--red)}
.reveal{margin:1rem 0 0;text-align:center;font:700 3rem/1.1 var(--display);letter-spacing:.08em;min-height:3.4rem;word-break:break-word}
.reveal span{display:inline-block;animation:pop .4s backwards}
.ltnav{display:flex;justify-content:space-between;margin-top:1.2rem}

/* game */
.gtop{display:flex;align-items:center;gap:.5rem;margin-bottom:.6rem}
.dots{flex:1;display:flex;justify-content:center;gap:.35rem;flex-wrap:wrap}
.dots i{width:1.6rem;height:1.6rem;display:grid;place-items:center;font-style:normal;font-size:1.1rem;border-radius:50%;background:#fff;border:.15rem solid var(--ink)}
.dots i.cur{background:var(--sky)}
.dots i.done{background:#e6e3f3}
.dots i.star{background:var(--sun)}
.turn{display:flex;align-items:center;justify-content:center;gap:.6rem;margin:0 0 .6rem;padding:.4rem;font:700 1.3rem var(--display);text-transform:uppercase;border-radius:1rem;background:var(--c);border:.18rem solid var(--ink);animation:pop .4s}
.turn .av{width:2.6rem;height:2.6rem;font-size:1.7rem;background:#fff}
.caption{text-align:center;font:700 1.25rem/1.2 var(--display);text-transform:uppercase;margin:.2rem 0 .7rem;min-height:1.5rem;color:var(--ink)}
.caption small{display:block;font:600 .9rem var(--display);color:var(--muted)}
.stage{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:.5rem;margin:0 auto .8rem;min-height:2rem;position:relative}
.stage.box{background:#fff;border:.18rem solid var(--ink);border-radius:1.4rem;padding:.8rem;box-shadow:0 .3rem 0 var(--ink)}
.opts{display:grid;gap:.9rem;grid-template-columns:repeat(var(--n,3),minmax(0,1fr))}
.opt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2rem;min-height:7.5rem;background:#fff;border:.2rem solid var(--ink);border-radius:1.4rem;box-shadow:0 .3rem 0 var(--ink);font:700 3.4rem/1 var(--display);color:var(--ink);padding:.4rem;transition:opacity .3s,transform .2s}
.opt .em{font-size:4rem;line-height:1.1}
.opt .sm{font:700 1rem var(--display);text-transform:uppercase}
.opt.no,[data-v].no{animation:shake .45s;opacity:.25}
.opt.yes{background:#d7f5df;animation:yay .6s}
.opt.hint,[data-v].hint{animation:hint 1s infinite}
@keyframes shake{20%,60%{transform:translateX(-.5rem)}40%,80%{transform:translateX(.5rem)}}
@keyframes yay{40%{transform:scale(1.12) rotate(-3deg)}}
@keyframes hint{50%{transform:scale(1.08);filter:drop-shadow(0 0 .5rem var(--sun))}}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
.opt.grp{flex-direction:row;flex-wrap:wrap;align-content:center;font-size:2rem;line-height:1.25;min-height:9rem;gap:.1rem}
.svgwrap [data-v].flash{opacity:.3}
.blob{width:5rem;height:5rem;border-radius:46% 54% 50% 50%/55% 45% 55% 45%;border:.18rem solid var(--ink);background:var(--col)}
.shape{width:5.2rem;height:5.2rem}
.shape svg{width:100%;height:100%;overflow:visible}
.items{display:flex;flex-direction:column;gap:.3rem;align-items:center}
.items .row{display:flex;gap:.3rem}
.items .it{font-size:2.6rem;line-height:1.15;width:3.1rem;text-align:center;border-radius:.8rem;cursor:pointer;transition:.2s}
.items .it.cnt{background:#ffe9a8;transform:scale(.9)}
.items.small .it{font-size:2rem;width:2.4rem}
.cntbadge{position:absolute;top:.4rem;right:.6rem;font:700 1.8rem var(--display);background:var(--sun);border:.15rem solid var(--ink);border-radius:1rem;padding:0 .6rem}
.groups{display:grid;grid-template-columns:1fr 1fr;gap:.9rem;width:100%}
.grp{background:#fff;border:.2rem solid var(--ink);border-radius:1.3rem;box-shadow:0 .3rem 0 var(--ink);padding:.7rem .3rem;min-height:9rem;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;align-content:center;gap:.1rem;font-size:2.1rem;line-height:1.2}
.seq{display:flex;flex-wrap:wrap;justify-content:center;gap:.35rem;align-items:center}
.seq>div{width:3.6rem;height:3.6rem;display:grid;place-items:center;font-size:2.6rem;background:#fff;border:.15rem solid var(--ink);border-radius:.8rem}
.seq .q{background:var(--sun);font:700 2.4rem var(--display);animation:hint 1.2s infinite}
.seq .shape{width:2.8rem;height:2.8rem}
.numline{display:flex;gap:.6rem;justify-content:center}
.numline div{width:4.6rem;height:4.6rem;display:grid;place-items:center;font:700 2.8rem var(--display);background:#fff;border:.18rem solid var(--ink);border-radius:1rem}
.numline .q{background:var(--sun)}
.pic{font-size:7rem;line-height:1.1;animation:pop .5s}
.bigsmall{display:flex;align-items:flex-end;justify-content:space-around;width:100%;min-height:11rem}
.bigsmall [data-v]{line-height:1;cursor:pointer}
.svgwrap{width:100%;max-width:23rem;margin:0 auto}
.svgwrap svg{width:100%;height:auto;display:block}
.svgwrap [data-v]{cursor:pointer;transition:opacity .2s}
.svgwrap [data-v].yes{animation:none;filter:drop-shadow(0 0 .4rem #2fb35a)}
.svgwrap [data-v].yes *{fill:#7ee29a}
.svgwrap .deco{pointer-events:none}
.after{text-align:center;font:700 2.2rem var(--display);letter-spacing:.06em;margin:.6rem 0 0;min-height:2.6rem}
.after span{display:inline-block;animation:pop .35s backwards}
.helpbtn{font-size:1.4rem}

/* balloons */
.sky{position:relative;width:100%;height:58vh;min-height:20rem;overflow:hidden;border:.18rem solid var(--ink);border-radius:1.4rem;background:linear-gradient(#bfe9ff,#eaf8ff);box-shadow:0 .3rem 0 var(--ink)}
.bal{position:absolute;bottom:-9rem;width:5.6rem;height:7rem;display:grid;place-items:center;font:700 2.8rem var(--display);color:#fff;-webkit-text-stroke:.08rem var(--ink);animation:rise linear infinite}
.bal::before{content:"";position:absolute;top:0;left:0;right:0;bottom:1.2rem;border-radius:50% 50% 48% 48%/55% 55% 45% 45%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.7),transparent 30%),var(--col);border:.15rem solid var(--ink);z-index:-1}
.bal::after{content:"";position:absolute;bottom:-.3rem;left:50%;width:.12rem;height:1.6rem;background:var(--ink)}
.bal span{position:relative;top:-.6rem}
.bal.popd{animation:popd .3s forwards!important}
.bal.no{opacity:1;animation-name:rise,shake}
@keyframes rise{from{transform:translateY(0)}to{transform:translateY(calc(-58vh - 10rem))}}
@keyframes popd{to{transform:scale(1.8);opacity:0}}

/* trace */
.trace{position:relative;width:100%;max-width:24rem;margin:0 auto;background:#fff;border:.2rem solid var(--ink);border-radius:1.4rem;box-shadow:0 .3rem 0 var(--ink);overflow:hidden;touch-action:none}
.trace canvas{position:absolute;top:0;left:0;right:0;bottom:0;width:100%;height:100%;touch-action:none}
.tracebtns{display:flex;justify-content:center;gap:1rem;margin-top:1rem}
.wordrow{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:.5rem;margin:0 0 .6rem}
.wem{font-size:3rem;line-height:1}
.wordline{display:flex;gap:.2rem}
.wordline span{display:grid;place-items:center;width:2.3rem;height:2.8rem;font:700 1.9rem var(--display);border-bottom:.25rem solid #d9cfee;color:#c4bddc}
.wordline span.cur{color:var(--ink);border-color:var(--orange);background:#fff1c2;border-radius:.5rem .5rem 0 0}
.wordline span.done{color:var(--blue);border-color:var(--leaf)}
.colors{display:flex;justify-content:center;gap:.5rem;margin-top:.7rem}
.colors button{width:2.4rem;height:2.4rem;border-radius:50%;border:.15rem solid var(--ink);background:var(--col)}
.colors button[aria-pressed=true]{outline:.25rem solid var(--ink);outline-offset:.1rem}

/* end */
.end{text-align:center;padding-top:1rem}
.end .av{width:8rem;height:8rem;font-size:5.4rem;margin:0 auto;animation:dance 1s ease-in-out infinite}
@keyframes dance{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-1.2rem) rotate(8deg)}}
.end h1{font-size:2.2rem;margin:1rem 0 .4rem}
.endstars{font-size:2.6rem;letter-spacing:.2rem;margin:.4rem 0}
.endstars span{display:inline-block;animation:pop .5s backwards}
.endbtns{display:flex;flex-wrap:wrap;justify-content:center;gap:.8rem;margin-top:1.4rem}
.byplayer{display:flex;justify-content:center;gap:1rem;margin:.6rem 0}
.byplayer div{display:flex;align-items:center;gap:.4rem;font:700 1.3rem var(--display)}
.byplayer .av{width:2.6rem;height:2.6rem;font-size:1.7rem;animation:none}

/* sticker reveal + album */
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;z-index:50;display:grid;place-items:center;background:rgba(42,35,80,.55);padding:1rem}
.newstk{width:min(22rem,90vw);text-align:center;padding:1.6rem 1rem;animation:flipin .8s}
.newstk .big{font-size:8rem;line-height:1.1;animation:spin 1s .6s}
.newstk h2{font-size:1.7rem;margin:.4rem 0 1rem}
@keyframes flipin{0%{transform:rotateY(90deg) scale(.4)}100%{transform:none}}
@keyframes spin{50%{transform:scale(1.25) rotate(15deg)}}
.album{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.6rem;padding:1rem}
.album div{aspect-ratio:1;display:grid;place-items:center;font-size:2.8rem;border-radius:1rem;background:#fff7e0;border:.15rem dashed #d9c48f}
.album div.got{background:#fff;border:.15rem solid var(--ink);animation:pop .4s backwards}
.album div.miss span{filter:brightness(0);opacity:.12}
.trophies{display:flex;flex-wrap:wrap;gap:.6rem;margin:.6rem 0 1rem}
.trophies span{font:700 1rem var(--display);background:var(--sun);border:.15rem solid var(--ink);border-radius:1rem;padding:.3rem .7rem;text-transform:uppercase}
.tabs{display:flex;gap:.5rem;overflow-x:auto;margin-bottom:.8rem;padding-bottom:.3rem}
.tabs button{flex:none;font:700 1rem var(--display);padding:.4rem .9rem;border-radius:1rem;border:.15rem solid var(--ink);background:#fff;text-transform:uppercase}
.tabs button[aria-pressed=true]{background:var(--sun)}

/* confetti */
.conf{position:fixed;top:-2rem;width:.7rem;height:1.1rem;z-index:60;pointer-events:none;animation:fall 1.6s ease-in forwards;border-radius:.15rem}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.flystar{position:fixed;z-index:61;font-size:3.5rem;pointer-events:none;transition:all .8s cubic-bezier(.5,-0.3,.7,1)}

/* parents */
.sheet{text-transform:none;overscroll-behavior:contain;position:fixed;top:0;left:0;right:0;bottom:0;z-index:40;background:var(--paper);overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet .wrap{padding-top:calc(1rem + env(safe-area-inset-top,0px))}
.sheet h2{font-size:1.25rem;margin:1.3rem 0 .6rem}
.panel{padding:.9rem 1rem;margin-bottom:.8rem;font-size:.95rem}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.6rem}
.kpi{padding:.7rem;text-align:center}
.kpi b{display:block;font:700 1.7rem var(--display)}
.kpi span{font-size:.8rem;color:var(--muted)}
.gbar{display:grid;grid-template-columns:7.5rem 1fr 4.6rem;align-items:center;gap:.5rem;font-size:.85rem;margin:.3rem 0}
.gbar .b{height:.8rem;background:#eee;border-radius:1rem;overflow:hidden}
.gbar .b i{display:block;height:100%;background:var(--leaf)}
.gbar .b i.mid{background:var(--sun)}.gbar .b i.low{background:var(--red)}
.gbar em{font-style:normal;color:var(--muted);text-align:right}
.fail{border-bottom:1px solid #eee;padding:.45rem 0;font-size:.85rem}
.fail small{color:var(--muted)}
.row2{display:flex;align-items:center;justify-content:space-between;gap:.8rem;padding:.5rem 0;border-bottom:1px solid #f0e8d6;font-size:1rem}
.sw{width:3.4rem;height:2rem;border-radius:1rem;border:.15rem solid var(--ink);background:#ddd;position:relative;flex:none}
.sw::after{content:"";position:absolute;top:.15rem;left:.15rem;width:1.4rem;height:1.4rem;border-radius:50%;background:#fff;border:.12rem solid var(--ink);transition:.2s}
.sw[aria-checked=true]{background:var(--leaf)}
.sw[aria-checked=true]::after{left:1.6rem}
.plrow{display:flex;align-items:center;gap:.6rem;padding:.5rem 0;border-bottom:1px solid #f0e8d6}
.plrow .av{width:2.6rem;height:2.6rem;font-size:1.6rem}
.plrow input{flex:1;min-width:0;font:700 1rem var(--display);text-transform:uppercase;padding:.35rem .5rem;border:.15rem solid var(--ink);border-radius:.6rem}
.small-btn{font:700 .85rem var(--display);padding:.35rem .6rem;border:.15rem solid var(--ink);border-radius:.7rem;background:#fff;text-transform:uppercase}
.small-btn.red{background:#ffe1de}
textarea{width:100%;min-height:6rem;padding:.6rem;border:.15rem solid var(--ink);border-radius:.8rem;font-size:1rem}
.lock{max-width:22rem;margin:3rem auto;text-align:center;padding:1.4rem}
.lock input{width:7rem;text-align:center;font:700 2rem var(--display);padding:.4rem;border:.18rem solid var(--ink);border-radius:.8rem;margin:.8rem 0}
.muted{color:var(--muted)}
.foot{text-align:center;color:var(--muted);font-size:.75rem;margin-top:2rem}

/* home: compact area tiles + sticker album at the bottom */
.tile.mix{width:100%;margin:0 0 .8rem;padding:1rem .8rem .6rem}
.tiles.areas{grid-template-columns:repeat(3,minmax(0,1fr));gap:.6rem}
.tiles.areas .tile{min-height:6.4rem;padding:1rem .2rem .5rem;border-radius:1.1rem;gap:.15rem}
.tiles.areas .tile::before{height:.6rem}
.tiles.areas .tile .ic{font-size:2.3rem;margin-top:.2rem}
.tiles.areas .tile .nm{font-size:.82rem}
.tile.turnsbtn{width:100%;margin-top:.8rem;padding:.9rem .8rem .5rem}
.tile.turnsbtn .ic{font-size:2rem}.tile.turnsbtn .nm{font-size:1.1rem}
.hello{margin:.1rem 0 .7rem}.hello .av{width:3.6rem;height:3.6rem;font-size:2.4rem}.hello h1{font-size:1.6rem}
.stkcard{display:block;width:100%;margin-top:1rem;padding:.7rem .8rem .5rem;background:#fff7e0;text-align:left}
.stkhead{display:flex;align-items:center;gap:.5rem;font:700 1.05rem var(--display)}
.stkhead .ic{font-size:1.7rem}.stkhead b{flex:1;min-width:0}
.stkhead .cnt{background:var(--sun);border:.13rem solid var(--ink);border-radius:1rem;padding:.05rem .55rem;font-size:.9rem}
.stktro{font:700 .8rem var(--display);margin:.3rem 0 0}
.minialbum{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:.3rem;margin:.6rem 0 .2rem}
.minialbum div{aspect-ratio:1;display:grid;place-items:center;font-size:1.45rem;border-radius:.6rem;border:.12rem dashed #d9c48f;background:#fffaf0}
.minialbum div.got{border:.13rem solid var(--ink);background:#fff}
.minialbum div.miss span{filter:brightness(0);opacity:.12}
.stkcard .prog{margin:.4rem 0 0;padding:0;border:0;box-shadow:none;background:none}
.homebtn{background:var(--sun)}
.secttl .homebtn{margin-left:auto}
.organ{display:block;width:5.2rem;height:5.2rem}.organ svg{width:100%;height:100%}
.organbig .organ{width:8rem;height:8rem;animation:pop .5s}
.sumrow{display:flex;align-items:center;justify-content:center;gap:.5rem;width:100%}
.sumrow .items{background:#fff;border:.18rem solid var(--ink);border-radius:1.2rem;padding:.5rem;min-width:6.5rem;min-height:6.5rem;justify-content:center;box-shadow:0 .25rem 0 var(--ink)}
.plus{font:700 3rem var(--display)}
.opt.wideopt{min-height:5rem;align-items:flex-start;padding:.6rem 1rem}
.trace::before{content:"";display:block;padding-top:100%}
/* fallbacks for older browsers without aspect-ratio (e.g. older Android tablets) */
@supports not (aspect-ratio:1){
 .animals button{height:4.6rem}
 .abc button{height:4.4rem}
 .album div{height:4.2rem}
 .minialbum div{height:2.4rem}
}
.pl.pick{position:relative}
.pl.pick .tick{position:absolute;top:.5rem;right:.6rem;width:2.2rem;height:2.2rem;border-radius:50%;display:grid;place-items:center;font:700 1.3rem var(--display);border:.18rem solid var(--ink);background:#fff;color:transparent}
.pl.pick[aria-pressed=true]{background:#d7f5df}
.pl.pick[aria-pressed=true] .tick{background:var(--leaf);color:#fff}
.players+.turnsbtn{margin-top:1.2rem}
.editbtn{font-size:1rem;padding:.45rem .9rem}
.pl.editing{position:relative;outline:.2rem dashed var(--orange);outline-offset:.2rem}
.pl .pencil{position:absolute;top:.4rem;right:.5rem;font-size:1.5rem}

<script>
/* ================= storage & state ================= */
const KEY='aj5_';

  set(k,v){try{localStorage.setItem(KEY+k,JSON.stringify(v))}catch(e){}}};

let cfg=Object.assign({voice:true,sounds:true,slow:false},store.get('cfg',{}));

let screen='players',G=null,abcL=null;

/* ================= sound ================= */
let actx=null;
function tone(seq){if(!cfg.sounds)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();let t=actx.currentTime;
  seq.forEach(([f,d,type])=>{const o=actx.createOscillator(),g=actx.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);
    g.gain.exponentialRampToValueAtTime(.22,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+d+.02);t+=d*.8});}catch(e){}}
const sOk=()=>tone([[660,.12],[880,.12],[1175,.25]]);
const sBad=()=>tone([[260,.18,'triangle'],[200,.24,'triangle']]);
const sPop=()=>tone([[900,.06,'square'],[300,.1,'triangle']]);
const sWin=()=>tone([[523,.14],[659,.14],[784,.14],[1046,.4]]);
const sTap=()=>tone([[700,.06]]);

/* ================= voice ================= */
function voiceFor(lang){try{const vs=speechSynthesis.getVoices();
  if(lang==='en')return vs.find(v=>/^en(-|_)GB/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang));
  return vs.find(v=>/^es(-|_)ES/i.test(v.lang))||vs.find(v=>/^es/i.test(v.lang));}catch(e){return null}}
try{speechSynthesis.onvoiceschanged=()=>{}}catch(e){}
function norm(parts){if(!parts)return[];if(typeof parts==='string')return[[parts]];return parts.filter(p=>p&&p[0])}
let speakTok=0;
function speak(parts,force){parts=norm(parts);return new Promise(res=>{const tok=++speakTok;
  if((!cfg.voice&&!force)||!window.speechSynthesis||!parts.length){res();return}
  try{const s=speechSynthesis;s.cancel();let total=0;
    parts.forEach((p,i)=>{const en=p[1]==='en';const u=new SpeechSynthesisUtterance(p[0]);u.lang=en?'en-GB':'es-ES';
      u.rate=(en?.85:.95)*(cfg.slow?.8:1);u.pitch=1.08;const v=voiceFor(en?'en':'es');if(v)u.voice=v;total+=p[0].length;
      if(i===parts.length-1){u.onend=()=>res();u.onerror=()=>res()}s.speak(u)});
    setTimeout(res,1200+total*90*(cfg.slow?1.25:1));}catch(e){res()}})}
const hush=()=>{try{speechSynthesis.cancel()}catch(e){}};

/* ================= effects ================= */
function confetti(n=34){const cols=['#ffc83d','#ef4b3f','#2f6fe4','#2fb35a','#f2679e','#7d5cf0','#ff8a2b'];
  for(let i=0;i<n;i++){const d=document.createElement('i');d.className='conf';d.style.left=R(100)+'vw';d.style.background=pick(cols);
    d.style.animationDelay=(Math.random()*.4)+'s';d.style.animationDuration=(1.2+Math.random()*.9)+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}}
function flyStar(from,to){if(!from||!to)return;const a=from.getBoundingClientRect(),b=to.getBoundingClientRect();const s=document.createElement('span');
  s.className='flystar';s.textContent='⭐';s.style.left=(a.left+a.width/2-28)+'px';s.style.top=(a.top+a.height/2-28)+'px';document.body.appendChild(s);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{s.style.left=(b.left+b.width/2-28)+'px';s.style.top=(b.top+b.height/2-28)+'px';s.style.transform='scale(.45)'}));
  setTimeout(()=>s.remove(),900)}
const PRAISE=['¡Muy bien!','¡Genial!','¡Eso es!','¡Fenomenal!','¡Bravo!','¡Lo has conseguido!','¡Qué bien!'];

  ${ed?'':`<div class="deco-row">${['🎨','🔢','🦁','🔤','🎈','🦴','⭐'].map((e,i)=>`<span style="animation-delay:${i*.35}s">${e}</span>`).join('')}</div>`}

  ${!ed&&players.length>1?`<button class="tile wide turnsbtn" style="--c:#2fb35a" data-act="turnpick"><span class="ic">👫</span><span class="nm">Jugar por turnos</span></button>`:''}

function miniAlbum(p){const n=stickersOf(p);const ai=Math.min(Math.floor(n/24),ALBUMS.length-1);const al=ALBUMS[ai];const k=p.stars%STARS_PER_STICKER;

function startRound(gids,mix,back){const pids=turns?turns.slice():[curId];

  let per=pids.length<=2?5:pids.length===3?4:3;
  if(!mix&&gids[0]==='trazapal')per=Math.min(per,2);else if(!mix&&(gids[0]==='trazalet'||gids[0]==='trazanum'))per=Math.min(per,3);
  G={gids,mix,n:pids.length>1?per*pids.length:n,i:0,back,res:[],by:{},stk:[],pids,introDone:false};

function weakPick(gids,pid){const p=P(pid);const w=gids.map(g=>{const s=p.stats[g];return s&&s.n>=3?1+2*(1-s.ok/s.n):1.3});
  let r=Math.random()*w.reduce((a,b)=>a+b,0);for(let i=0;i<gids.length;i++){r-=w[i];if(r<=0)return gids[i]}return gids[0]}
function renderQ(){show('game');const pid=G.pids[G.i%G.pids.length];const p=P(pid);G.pid=pid;
  const gid=G.mix?weakPick(G.gids,pid):G.gids[0];let q=GAMES[gid].gen();
  let guard=0;while(G.lastLabel&&q.label===G.lastLabel&&guard++<5)q=GAMES[gid].gen();G.lastLabel=q.label;
  q.gid=gid;G.q=q;G.first=true;G.wrong=0;G.locked=false;
  const dots=Array.from({length:G.n},(_,i)=>`<i class="${i<G.i?(G.res[i]?'star':'done'):i===G.i?'cur':''}">${i<G.i&&G.res[i]?'⭐':''}</i>`).join('');

    body=(q.word?`<div class="wordrow"><span class="wem">${q.word.e}</span><div class="wordline">${[...q.word.w].map((c,i)=>`<span class="${i===0?'cur':''}">${c}</span>`).join('')}</div></div>`:'')+
    `<div class="trace" id="trace"><canvas id="tg"></canvas><canvas id="td"></canvas></div>
    <div class="colors">${['#2f6fe4','#ef4b3f','#2fb35a','#7d5cf0','#ff8a2b'].map(c=>`<button data-act="pen" data-c="${c}" style="--col:${c}" aria-pressed="${c===pc}" aria-label="Color"></button>`).join('')}</div>

  else{body=(q.stage?`<div class="stage${q.box?' box':''}" id="stage">${q.stage}</div>`:'')+
    (q.opts?`<div class="opts" style="--n:${q.cols||q.opts.length}">${q.opts.map(o=>`<button class="opt ${o.cls||''}" data-v="${esc(o.v)}">${o.html}</button>`).join('')}</div>`:'')}
  app.innerHTML=`<div class="gtop"><button class="round" data-act="quit" aria-label="Salir">✕</button>${homeBtn()}<div class="dots" id="dots">${dots}</div>
    ${q.lang==='en'?'<button class="round helpbtn" data-act="es" aria-label="En español">🇪🇸</button>':''}<button class="round" data-act="repeat" aria-label="Repetir">🔊</button></div>
   ${G.pids.length>1?`<div class="turn" style="--c:${avOf(p)[1]}">${avHtml(p)} Le toca a ${esc(p.name)}</div>`:''}
   <div class="caption">${esc(q.cap)}${q.sub?`<small>${esc(q.sub)}</small>`:''}</div>${body}<div class="after" id="after"></div>`;
  if(q.trace)startTraceQ(q);
  const intro=[];if(!G.introDone){G.introDone=true;const g=GAMES[gid];if(!G.mix)intro.push([g.say,g.lang]);}

const isOk=(q,v)=>Array.isArray(q.answer)?q.answer.includes(v):v===q.answer;
function labOf(q,v){const o=q.opts&&q.opts.find(o=>o.v===v);if(o)return o.lab;if(q.names&&q.names[v])return q.names[v];return v}
async function answer(v,el){if(!G||G.locked||el.classList.contains('no'))return;const q=G.q;const p=P(G.pid);

    if(G.first){G.first=false;p.fails.unshift({t:Date.now(),g:q.gid,q:q.label,a:labOf(q,v),c:Array.isArray(q.answer)?'una articulación':labOf(q,q.answer)});p.fails=p.fails.slice(0,40);save()}
    if(el.closest('svg')){el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),800)}

    speak([...ws,...again,...extra])}}

  if(b){b.hidden=!n;b.textContent=n}sTap();if(n)speak(G.q.countLang==='en'?[[NUM_EN[n]||String(n),'en']]:[[NUM_ES[n]]])}

/* ---- guided tracing: green start dot, arrow, animated demo, stroke-by-stroke check ---- */
let TR=null,_sp=null;const TOL=12;
function samplePath(d,step=2.5){if(!_sp){const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('width','0');s.setAttribute('height','0');
    s.style.cssText='position:absolute;left:-10px;top:-10px';_sp=document.createElementNS('http://www.w3.org/2000/svg','path');s.appendChild(_sp);document.body.appendChild(s)}
  _sp.setAttribute('d',d);const L=_sp.getTotalLength();const n=Math.max(2,Math.ceil(L/step));const pts=[];
  for(let i=0;i<=n;i++){const q=_sp.getPointAtLength(L*i/n);pts.push([q.x,q.y])}return {pts,len:L}}
function glyphStrokes(text){let x=0;const out=[];[...text].forEach(ch=>{(STROKES[ch]||[]).forEach(d=>{const s=samplePath(d);out.push({d,dx:x,pts:s.pts.map(([a,b])=>[a+x,b]),len:s.len})});x+=ch==='1'?55:85});return out}
const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
function setupTrace(text,onDone){const box=$('trace'),tg=$('tg'),td=$('td');if(!box)return;if(box.clientHeight<box.clientWidth*.9)box.style.height=box.clientWidth+'px';const size=box.clientWidth;const dpr=Math.min(window.devicePixelRatio||1,3);
  [tg,td].forEach(c=>{c.width=size*dpr;c.height=size*dpr});
  const strokes=glyphStrokes(text);let mn=1e9,mx=-1e9;strokes.forEach(st=>st.pts.forEach(([x])=>{mn=Math.min(mn,x);mx=Math.max(mx,x)}));
  const s=Math.min(size*.84/100,size*.84/(mx-mn+20));const ox=size/2-s*(mn+mx)/2,oy=size/2-s*52;
  const tok=(TR&&TR.tok||0)+1;
  TR={tok,text,box,tg,td,dpr,size,s,ox,oy,strokes,si:0,next:0,color:(TR&&TR.color)||'#2f6fe4',demo:false,done:false,onDone,drawing:false,last:null,hintAt:0};
  if(!td._bound){td._bound=1;
    const pt=e=>{const r=td.getBoundingClientRect();const cx=(e.clientX-r.left)*TR.size/r.width,cy=(e.clientY-r.top)*TR.size/r.height;return [(cx-TR.ox)/TR.s,(cy-TR.oy)/TR.s]};
    td.addEventListener('pointerdown',e=>{e.preventDefault();if(!TR||TR.demo||TR.done)return;try{td.setPointerCapture(e.pointerId)}catch(_){}
      const p=pt(e);TR.drawing=true;TR.last=p;inkDot(p);
      const st=TR.strokes[TR.si];const anchor=st.pts[Math.max(0,TR.next-1)];TR.armed=dist(p,anchor)<TOL*1.8;
      if(!TR.armed&&Date.now()-TR.hintAt>3000){TR.hintAt=Date.now();speak(TR.next===0?'Empieza en el punto verde.':'Sigue desde donde lo has dejado.');pulseStart()}
      advance(p)});
    td.addEventListener('pointermove',e=>{if(!TR||!TR.drawing)return;e.preventDefault();const p=pt(e);inkLine(TR.last,p);
      const steps=Math.max(1,Math.ceil(dist(TR.last,p)/3));for(let i=1;i<=steps;i++){if(!TR.drawing)break;advance([TR.last[0]+(p[0]-TR.last[0])*i/steps,TR.last[1]+(p[1]-TR.last[1])*i/steps])}TR.last=p});
    const up=()=>{if(!TR||!TR.drawing)return;TR.drawing=false;
      if(!TR.done&&TR.next<3&&Date.now()-TR.hintAt>3000){TR.hintAt=Date.now();speak('Sigue la flecha desde el punto verde.');pulseStart()}};
    td.addEventListener('pointerup',up);td.addEventListener('pointercancel',up)}
  drawGuide();setTimeout(()=>{if(TR&&TR.tok===tok)runDemo()},500)}
function bctx(c){const x=c.getContext('2d');x.setTransform(TR.dpr*TR.s,0,0,TR.dpr*TR.s,TR.dpr*TR.ox,TR.dpr*TR.oy);x.lineCap='round';x.lineJoin='round';return x}
function strokePath(x,st){x.save();x.translate(st.dx,0);x.stroke(new Path2D(st.d));x.restore()}
function polyline(x,pts,upto){if(upto<1)return;x.beginPath();x.moveTo(...pts[0]);for(let i=1;i<=Math.min(upto,pts.length-1);i++)x.lineTo(...pts[i]);x.stroke()}
function drawGuide(){const x=TR.tg.getContext('2d');x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,TR.tg.width,TR.tg.height);const c=bctx(TR.tg);
  TR.strokes.forEach((st,i)=>{c.setLineDash([]);c.lineWidth=15;c.strokeStyle=i<TR.si?TR.color:i===TR.si?'#ffe9a0':'#e6ebf7';strokePath(c,st);

  if(TR.done)return;const st=TR.strokes[TR.si];
  c.lineWidth=15;c.strokeStyle=TR.color;polyline(c,st.pts,TR.next);
  // arrow along the current stroke
  const k=Math.min(st.pts.length-3,Math.max(TR.next+6,Math.round(st.pts.length*.3)));if(k>2){const a=st.pts[k-2],b=st.pts[k+2]||st.pts[k];const ang=Math.atan2(b[1]-a[1],b[0]-a[0]);
    c.save();c.translate(st.pts[k][0],st.pts[k][1]);c.rotate(ang);c.fillStyle='#2fb35a';c.beginPath();c.moveTo(6,0);c.lineTo(-4,-5);c.lineTo(-4,5);c.closePath();c.fill();c.restore()}
  // green start dot with stroke number
  if(TR.next===0){const [sx,sy]=st.pts[0];c.fillStyle='#2fb35a';c.strokeStyle='#fff';c.lineWidth=1.6;c.beginPath();c.arc(sx,sy,7,0,Math.PI*2);c.fill();c.stroke();
    if(TR.strokes.length>1){c.fillStyle='#fff';c.font='700 9px Fredoka, Arial, sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText(TR.si+1,sx,sy+.5)}}}
function pulseStart(){if(!TR||TR.done)return;const st=TR.strokes[TR.si];let t=0;const tok=TR.tok;
  const f=()=>{if(!TR||TR.tok!==tok||TR.next>0)return;drawGuide();const c=bctx(TR.tg);c.strokeStyle='rgba(47,179,90,'+(1-t/30)+')';c.lineWidth=2.5;c.beginPath();c.arc(st.pts[0][0],st.pts[0][1],7+t*.5,0,Math.PI*2);c.stroke();
    if(++t<30)requestAnimationFrame(f);else drawGuide()};f()}
function inkCtx(){const c=bctx(TR.td);c.strokeStyle=TR.color;c.globalAlpha=.45;c.lineWidth=8;return c}
function inkDot(p){const c=inkCtx();c.beginPath();c.moveTo(...p);c.lineTo(p[0]+.1,p[1]+.1);c.stroke()}
function inkLine(a,b){const c=inkCtx();c.beginPath();c.moveTo(...a);c.lineTo(...b);c.stroke()}
function clearInk(){if(!TR)return;const x=TR.td.getContext('2d');x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,TR.td.width,TR.td.height)}

  if(TR.next>=st.pts.length-1){TR.si++;TR.next=0;TR.armed=false;clearInk();sTap();
    if(TR.si>=TR.strokes.length){TR.done=true;TR.drawing=false;drawGuide();const tok=TR.tok;setTimeout(()=>{if(TR&&TR.tok===tok&&TR.onDone)TR.onDone()},250);return}
    drawGuide();return}
  if(TR.next!==old)drawGuide()}
function runDemo(){if(!TR||TR.done)return;const tok=TR.tok;TR.demo=true;TR.drawing=false;clearInk();const strokes=TR.strokes.slice(TR.si);let i=0,t0=null;
  const step=ts=>{if(!TR||TR.tok!==tok)return;if(t0===null)t0=ts;const st=strokes[i];const dur=Math.max(500,st.len*11);const f=Math.min(1,(ts-t0)/dur);

    for(let k=0;k<i;k++)polyline(c,strokes[k].pts,strokes[k].pts.length-1);const n=Math.round(f*(st.pts.length-1));polyline(c,st.pts,n);

  layer._next=list}

/* ================= album ================= */
function renderAlbum(ai){show('album');const p=me();const n=stickersOf(p);const total=ALBUMS.length*24;
  const curAl=Math.min(Math.floor(n/24),ALBUMS.length-1);if(ai==null)ai=curAl;
  const done=ALBUMS.map((a,i)=>n>=(i+1)*24);
  app.innerHTML=topBar()+`<div class="secttl"><span class="ic">📒</span><h1>Mis pegatinas</h1></div>
   ${done.some(Boolean)?`<div class="trophies">${ALBUMS.map((a,i)=>done[i]?`<span>🏆 ${a.name}</span>`:'').join('')}</div>`:''}
   <div class="tabs">${ALBUMS.map((a,i)=>i<=curAl?`<button data-act="albumtab" data-i="${i}" aria-pressed="${i===ai}">${a.name}</button>`:'').join('')}</div>
   <div class="card album">${ALBUMS[ai].items.map((em,i)=>{const got=ai*24+i<n;return `<div class="${got?'got':'miss'}"${got?` style="animation-delay:${i*.03}s"`:''}><span>${em}</span></div>`}).join('')}</div>
   <p class="muted" style="text-align:center">${n>=total?'¡Lo tienes todo!':`Cada ${STARS_PER_STICKER} estrellas, una pegatina nueva.`}</p>`;
  speak(n?`Tienes ${n===1?'una pegatina':n+' pegatinas'}.`:'Gana estrellas para conseguir pegatinas.')}

/* ================= parents corner ================= */
let lockAns=0;
function openLock(){const a=3+R(7),b=3+R(7);lockAns=a*b;hush();
  layer.innerHTML=`<div class="sheet"><div class="card lock"><h2 style="font-size:1.4rem">Rincón para mayores</h2><p class="muted">¿Cuánto es ${a} × ${b}?</p>
   <input id="lockin" inputmode="numeric" autocomplete="off"><div style="display:flex;gap:.6rem;justify-content:center">
   <button class="btn" data-act="closesheet">Cancelar</button><button class="btn blue" data-act="unlock">Entrar</button></div></div></div>`;
  setTimeout(()=>{const i=$('lockin');if(i)i.focus()},50);$('lockin').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()})}
function unlock(){if(+$('lockin').value===lockAns)renderParents(curId||(players[0]&&players[0].id));else{$('lockin').value='';$('lockin').placeholder='¡Prueba otra vez!'}}
const pct=(a,b)=>b?Math.round(a/b*100):0;
function renderParents(pid){const p=P(pid);let h=`<div class="wrap"><div class="top"><h1 class="grow" style="font-size:1.35rem;text-transform:none">👨‍👩‍👧‍👦 Rincón para mamá y papá</h1><button class="round" data-act="closesheet" aria-label="Cerrar">✕</button></div>`;
  if(p){h+=`<div class="tabs">${players.map(x=>`<button data-act="ptab" data-id="${x.id}" aria-pressed="${x.id===pid}">${avOf(x)[0]} ${esc(x.name)}</button>`).join('')}</div>`;
    const st=Object.values(p.stats);const n=st.reduce((a,s)=>a+s.n,0),ok=st.reduce((a,s)=>a+s.ok,0);
    h+=`<div class="kpis"><div class="card kpi"><b>${n}</b><span>preguntas respondidas</span></div><div class="card kpi"><b>${pct(ok,n)}%</b><span>a la primera</span></div>
      <div class="card kpi"><b>⭐ ${p.stars}</b><span>estrellas</span></div><div class="card kpi"><b>${stickersOf(p)}</b><span>pegatinas</span></div></div>`;
    const weak=Object.entries(p.stats).filter(([g,s])=>s.n>=4&&s.ok/s.n<.7&&GAMES[g]).sort((a,b)=>a[1].ok/a[1].n-b[1].ok/b[1].n).slice(0,4);
    h+=`<h2>Para reforzar</h2><div class="card panel">${weak.length?weak.map(([g,s])=>`• <b>${GAMES[g].name}</b> (${AREAS.find(a=>a.id===GAMES[g].area).name}) — ${pct(s.ok,s.n)}% a la primera`).join('<br>'):'<span class="muted">Nada destacable todavía. Aparecen aquí los juegos con menos del 70 % a la primera (mínimo 4 preguntas).</span>'}</div>`;
    h+=`<h2>Por juegos</h2><div class="card panel">`;let any=false;
    AREAS.forEach(a=>{const rows=a.games.filter(g=>p.stats[g]&&p.stats[g].n);if(!rows.length)return;any=true;
      h+=`<div style="font:700 .95rem var(--display);margin:.5rem 0 .2rem">${a.ic} ${a.name}</div>`+rows.map(g=>{const s=p.stats[g],v=pct(s.ok,s.n);
        return `<div class="gbar"><span>${GAMES[g].name}</span><div class="b"><i class="${v<50?'low':v<75?'mid':''}" style="width:${v}%"></i></div><em>${v}% · ${s.n}</em></div>`}).join('')});
    h+=(any?'':'<span class="muted">Todavía no ha jugado.</span>')+`</div>`;
    h+=`<h2>Últimos fallos</h2><div class="card panel">${p.fails.length?p.fails.slice(0,15).map(f=>`<div class="fail"><b>${esc(f.q)}</b><br>Contestó: ${esc(f.a)} · Correcta: <b>${esc(f.c)}</b><br><small>${GAMES[f.g]?GAMES[f.g].name:''} · ${new Date(f.t).toLocaleString('es-ES',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</small></div>`).join(''):'<span class="muted">Sin fallos guardados.</span>'}</div>
     <button class="small-btn red" data-act="resetpl" data-id="${p.id}">Borrar el progreso de ${esc(p.name)}</button>`}
  h+=`<h2>Jugadores</h2><div class="card panel">${players.map(x=>`<div class="plrow">${avHtml(x)}<b style="flex:1;min-width:0;font:700 1rem var(--display)">${esc(x.name)}</b>
     <button class="small-btn" data-act="editpl" data-id="${x.id}">✏️ Editar</button><button class="small-btn red" data-act="delpl" data-id="${x.id}">Borrar</button></div>`).join('')}
     <div style="margin-top:.6rem"><button class="small-btn" data-act="addfromparents">+ Añadir jugador</button></div>
     <p class="muted" style="font-size:.8rem;margin:.5rem 0 0">Con «Editar» puedes cambiar el animal y el nombre. También desde «¿Quién juega?» → ✏️ Editar.</p></div>`;
  h+=`<h2>Ajustes</h2><div class="card panel">
     <div class="row2">Leer en voz alta<button class="sw" role="switch" aria-checked="${cfg.voice}" data-act="cfg" data-k="voice"></button></div>
     <div class="row2">Voz más despacio<button class="sw" role="switch" aria-checked="${cfg.slow}" data-act="cfg" data-k="slow"></button></div>
     <div class="row2" style="border:0">Sonidos<button class="sw" role="switch" aria-checked="${cfg.sounds}" data-act="cfg" data-k="sounds"></button></div></div>`;
  h+=`<h2>Copia de seguridad</h2><div class="card panel"><p class="muted" style="margin:0 0 .6rem;font-size:.85rem">Los jugadores y su progreso se guardan en este navegador. Si se borran los datos del navegador o cambias de aparato, se pierden. Copia este código y guárdalo (por ejemplo, mándatelo por WhatsApp o email) para poder recuperarlo.</p>
     <div style="display:flex;gap:.6rem;flex-wrap:wrap"><button class="small-btn" data-act="bkcopy">📋 Copiar código</button><button class="small-btn" data-act="bkrestore">♻️ Restaurar desde código</button></div>
     <textarea id="bk" style="margin-top:.6rem;min-height:4.5rem;font-size:.75rem" placeholder="Aquí sale el código, o pega aquí uno guardado para restaurarlo"></textarea><span id="bkmsg" class="muted" style="font-size:.85rem"></span></div>`;
  h+=`<h2>Sugerencias o errores</h2><div class="card panel"><textarea id="sug" placeholder="Cuéntanos qué mejorarías o qué no funciona…"></textarea>
     <div style="display:flex;align-items:center;gap:.8rem;margin-top:.6rem"><button class="btn blue" data-act="sendsug" style="font-size:.95rem">Enviar</button><span id="sugmsg" class="muted" style="font-size:.85rem"></span></div></div>
     <p class="foot">Los datos (jugadores, estrellas y progreso) se guardan solo en este aparato.</p></div>`;
  layer.innerHTML=`<div class="sheet" id="sheet">${h}</div>`;
  layer.querySelectorAll('[data-rename]').forEach(i=>i.addEventListener('change',()=>{const x=P(i.dataset.rename);const v=i.value.trim().toUpperCase();if(x&&v){x.name=v;save()}}))}
const W3F_KEY='24ac0b1f-faa1-4d07-85b4-de4e988548fe';
async function sendSug(){const t=$('sug').value.trim(),m=$('sugmsg');if(!t){m.textContent='Escribe algo primero.';return}m.textContent='Enviando…';
  try{const res=await fetch('https://api.web3forms.com/submit',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},
    body:JSON.stringify({access_key:W3F_KEY,subject:'¡A aprender jugando! (Infantil) – sugerencia',from_name:'¡A aprender jugando!',message:t,jugadores:players.map(p=>p.name).join(', ')})});
    const j=await res.json();if(j.success){m.textContent='¡Enviado, gracias!';$('sug').value=''}else m.textContent='No se ha podido enviar.'}catch(e){m.textContent='No se ha podido enviar (¿sin conexión?).'}}

/* ================= actions ================= */
/* two-tap confirmation (confirm() is blocked in some embedded viewers) */
function sure(el){if(el.dataset.sure)return true;el.dataset.sure=1;el.dataset.txt=el.textContent;el.textContent='¿Seguro? Toca otra vez';
  setTimeout(()=>{if(el.isConnected){delete el.dataset.sure;el.textContent=el.dataset.txt}},4000);return false}
function backFromGame(){const b=G&&G.back;G=null;if(!b||b==='home')renderHome();else renderArea(b)}
function act(a,el){const id=el.dataset.id;
  switch(a){
   case 'pick':editMode=false;curId=id;turns=null;save();sTap();renderHome();speak(`¡Hola, ${me().name.toLowerCase()}! ¿A qué jugamos?`);break;
   case 'addpl':draft=null;renderAdd();speak('Elige tu animal y escribe tu nombre.');break;
   case 'draftav':draft.av=+el.dataset.i;app.querySelectorAll('.animals button').forEach(b=>b.setAttribute('aria-pressed',b===el));sTap();speak(`El ${AV_NAMES[draft.av]}`);break;
   case 'saveplayer':savePlayer();break;
   case 'players':renderPlayers();speak('¿Quién juega?');break;
   case 'home':G=null;layer.innerHTML='';renderHome();break;
   case 'area':sTap();if(id==='let'&&screen==='abc'){renderArea(id);break}renderArea(id);speak(AREAS.find(x=>x.id===id).name);break;
   case 'game':sTap();if(GAMES[id].explore){renderAbc();speak('El abecedario. Toca una letra.')}else startRound([id],false,GAMES[id].area);break;
   case 'mixarea':startRound(AREAS.find(x=>x.id===id).games.filter(g=>!GAMES[g].explore),true,id);speak('¡Todo mezclado!');break;
   case 'mixall':startRound(Object.keys(GAMES).filter(g=>!GAMES[g].explore),true,'home');break;
   case 'album':renderAlbum();break;
   case 'albumtab':renderAlbum(+el.dataset.i);break;
   case 'turnpick':tsel=[];renderTurnPick();speak('¿Quién va a jugar? Tocad los que vais a jugar.');break;
   case 'tsel':{const i=tsel.indexOf(id);if(i>=0)tsel.splice(i,1);else{tsel.push(id);speak(P(id).name.toLowerCase())}sTap();renderTurnPick();break}
   case 'tgo':if(tsel.length<2){speak('Tienen que jugar dos o más.');break}turns=players.filter(p=>tsel.includes(p.id)).map(p=>p.id);curId=turns[0];save();renderHome();
     speak(`¡Vamos a jugar por turnos! ${turns.map(id=>P(id).name.toLowerCase()).join(' y ')}.`);break;
   case 'noturns':turns=null;renderPlayers();speak('¿Quién juega?');break;
   case 'abc':renderAbc();break;
   case 'letter':sTap();renderLetter(el.dataset.l);break;
   case 'sayletter':speak(letterSay(abcL));el.style.animation='none';el.offsetWidth;el.style.animation='';break;
   case 'word':tapWord(+el.dataset.j,el);break;
   case 'quit':backFromGame();break;
   case 'repeat':if(G)speak(G.q.say);break;
   case 'es':if(G&&G.q.es)speak([[G.q.es]]);break;
   case 'pen':if(TR){TR.color=el.dataset.c;drawGuide()}app.querySelectorAll('.colors button').forEach(b=>b.setAttribute('aria-pressed',b===el));break;
   case 'tclear':clearInk();break;
   case 'tdemo':if(TR&&!TR.demo&&!TR.done){speak('Mira.');runDemo()}break;
   case 'again':startRound(G.gids,G.mix,G.back);break;
   case 'back':backFromGame();break;
   case 'closestk':{const rest=layer._next||[];layer.innerHTML='';showStickers(rest);break}
   case 'parents':openLock();break;
   case 'unlock':unlock();break;
   case 'closesheet':layer.innerHTML='';if(!me()||screen==='players'){renderPlayers()}else if(screen==='home')renderHome();else if(screen==='album')renderAlbum();break;
   case 'ptab':renderParents(id);break;
   case 'resetpl':{const x=P(id);if(x&&sure(el)){x.stars=0;x.stats={};x.fails=[];save();renderParents(id)}break}
   case 'delpl':{const x=P(id);if(x&&sure(el)){players=players.filter(y=>y.id!==id);if(curId===id)curId=players[0]?players[0].id:null;turns=null;save();
     if(players.length)renderParents(curId);else{layer.innerHTML='';renderPlayers()}}break}
   case 'editmode':editMode=!editMode;sTap();renderPlayers();if(editMode)speak('¿A quién editamos?');break;
   case 'editpl':layer.innerHTML='';draft=null;renderAdd(id);speak('Elige el animal y el nombre.');break;
   case 'addfromparents':layer.innerHTML='';draft=null;renderAdd();break;
   case 'cfg':{const k=el.dataset.k;cfg[k]=!cfg[k];store.set('cfg',cfg);el.setAttribute('aria-checked',cfg[k]);if(k==='voice'&&!cfg.voice)hush();if(k==='slow'&&cfg.voice)speak('Así hablo ahora.');break}
   case 'sendsug':sendSug();break;
   case 'bkcopy':{const code='AJ5:'+btoa(unescape(encodeURIComponent(JSON.stringify({v:1,players,cfg}))));const t=$('bk');t.value=code;t.select();
     let ok=false;try{navigator.clipboard.writeText(code).then(()=>{$('bkmsg').textContent='¡Copiado! Pégalo donde quieras guardarlo.'}).catch(()=>{$('bkmsg').textContent='Selecciona el texto y cópialo.'});ok=true}catch(e){}
     if(!ok)$('bkmsg').textContent='Selecciona el texto y cópialo.';break}
   case 'bkrestore':{const raw=($('bk').value||'').trim();let data=null;try{data=JSON.parse(decodeURIComponent(escape(atob(raw.replace(/^AJ5:/,'')))))}catch(e){}
     if(!data||!Array.isArray(data.players)){$('bkmsg').textContent='Ese código no es válido. Pega el código completo.';break}
     if(!sure(el))break;players=data.players;if(data.cfg)cfg=Object.assign(cfg,data.cfg);store.set('cfg',cfg);curId=players[0]?players[0].id:null;turns=null;save();
     layer.innerHTML='';renderPlayers();speak('¡Datos recuperados!');break}
  }}
document.addEventListener('click',e=>{const t=e.target;
  if(screen==='game'&&G&&!t.closest('#layer')){const c=t.closest('[data-count]');if(c){countTap(c);return}
    const z=t.closest('[data-v]');if(z&&app.contains(z)){answer(z.dataset.v,z);return}}
  const a=t.closest('[data-act]');if(a)act(a.dataset.act,a)});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});

/* ================= start ================= */
if(curId&&!me())curId=null;
// ask the browser to keep our data (makes automatic clean-up less likely)
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
renderPlayers();
</script>
</body>
